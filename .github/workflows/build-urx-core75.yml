name: Build URX Core75 firmware

on:
  push:
    paths:
      - "keyboards/urx/core75/**"
      - "lib/rdmctmzt_common/**"
      - "lib/chibios-contrib/**"
      - ".github/workflows/build-urx-core75.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-urx-core75-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile urx/core75:default
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Allow the container to use the checked-out repository
        run: git config --global --add safe.directory '*'

      - name: Check out firmware source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compile firmware
        run: qmk compile -kb urx/core75 -km default

      - name: Upload flashable firmware
        uses: actions/upload-artifact@v7
        with:
          name: urx-core75-default-${{ github.sha }}
          path: urx_core75_default.bin
          if-no-files-found: error
          retention-days: 30
